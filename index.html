<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vicky's English · V3</title><style>
:root{--p:#6c63ff;--p2:#8b5cf6;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e6e8ef;--good:#16a34a;--bad:#dc2626;--gold:#f59e0b}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,#5b54e8,#8b5cf6);color:#fff;position:sticky;top:0;z-index:20}.head{max-width:1200px;margin:auto;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;font-size:22px}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#ffffff22;padding:8px 12px;border-radius:20px}nav{max-width:1200px;margin:auto;padding:0 12px 12px;display:flex;gap:6px;overflow:auto}nav button{white-space:nowrap;border:0;background:#ffffff1f;color:#fff;padding:9px 12px;border-radius:18px;cursor:pointer}nav button.active,nav button:hover{background:#fff;color:var(--p)}main{max-width:1200px;margin:auto;padding:22px 16px 60px}.page{display:none}.page.active{display:block}.hero,.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 6px 24px #1f29370d;border:1px solid var(--line)}.hero{margin-bottom:16px}.hero.purple{background:linear-gradient(135deg,#5b54e8,#8b5cf6);color:#fff;border:0}.hero.purple .muted{color:#eee}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.stat{font-size:29px;font-weight:800;color:var(--p)}.muted,.small{color:var(--muted)}.small{font-size:13px}.btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:700;background:var(--p);color:#fff}.btn.alt{background:#eef2ff;color:#4f46e5}.btn.gray{background:#eef0f3;color:#374151}.btn.gold{background:#fff3cd;color:#92400e}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.select,input,textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;font-size:15px}textarea{width:100%;min-height:130px;resize:vertical}.tag{display:inline-block;background:#eef2ff;color:#4f46e5;border-radius:999px;padding:4px 8px;font-size:12px;margin:2px}.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),#a78bfa)}.quest{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#f7f8ff;padding:14px;border-radius:13px;margin:9px 0}.monster{font-size:46px}.question{font-size:20px;font-weight:700;line-height:1.65}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:12px 0}.choice{text-align:left;border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:12px;cursor:pointer}.choice:hover{border-color:var(--p)}.feedback{margin-top:12px;padding:13px;border-radius:11px;line-height:1.7}.good{background:#effbf2;color:#166534}.bad{background:#fff1f1;color:#991b1b}.resource,.zone,.wrongitem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.resource h3,.zone h3{margin-top:0}.library{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.zone{min-height:155px}.locked{opacity:.45}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;z-index:50}.toast.show{opacity:1;transform:none}.center{text-align:center}.ref{background:#f0fdf4;border-left:4px solid #22c55e;padding:13px;border-radius:8px;margin-top:12px}.wrongitem{border-left:4px solid #ef4444;margin:9px 0}.master{border-left-color:#22c55e}.modebtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer}.modebtn.active{background:#eef2ff;color:#4f46e5;border-color:#8b5cf6}@media(max-width:800px){.g2,.g3,.g4,.library,.map{grid-template-columns:1fr}.head{align-items:flex-start;gap:10px;flex-direction:column}.choices{grid-template-columns:1fr} const NAV=[['home','🏠 首页'],['today','☀️ 今日'],['map','🗺️ 冒险'],['vocab','📚 单词'],['grammar','📝 语法'],['listen','🎧 听力'],['speak','🗣️ 口语'],['read','📖 阅读'],['write','✍️ 写作'],['trans','🌍 翻译'],['catti','👹 CATTI'],['media','🎬 影视'],['wrong','📕 错题本'],['review','🔁 复习'],['progress','🏆 进度'],['relax','🌙 放松'],['settings','⚙️ 设置']];
const DATA={xp:0,done:0,streak:0,lastDay:'',wrong:[],words:{},ach:[],history:[]};let S=Object.assign(DATA,JSON.parse(localStorage.getItem('VickysEnglishV3')||'{}'));function save(){localStorage.setItem('VickysEnglishV3',JSON.stringify(S));update()}function today(){return new Date().toISOString().slice(0,10)}function dayInit(){let t=today();if(S.lastDay!==t){S.lastDay=t;S.todayDone={};if(S.lastStudy===t){}else if(S.lastStudy){let d=new Date(S.lastStudy),y=new Date();y.setDate(y.getDate()-1);S.streak=d.toISOString().slice(0,10)===y.toISOString().slice(0,10)?(S.streak||0)+1:1}else S.streak=1;S.lastStudy=t;saveRaw()}}function saveRaw(){localStorage.setItem('VickysEnglishV3',JSON.stringify(S))}function lvl(){return Math.floor(S.xp/100)+1}function gain(n,task){dayInit();if(task&&S.todayDone?.[task]){toast('这个任务今天已经完成啦');return}S.xp+=n;S.done++;if(task){S.todayDone=S.todayDone||{};S.todayDone[task]=1}S.history.push({t:Date.now(),n});achievements();save();toast('+'+n+' XP ⚡')}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}function update(){document.getElementById('xp').textContent=S.xp;document.getElementById('lv').textContent=lvl();document.getElementById('streak').textContent=S.streak||0;if(document.getElementById('homeXP'))document.getElementById('homeXP').textContent=S.xp;if(document.getElementById('homeWrong'))document.getElementById('homeWrong').textContent=S.wrong.filter(x=>!x.master).length;if(document.getElementById('homeDone'))document.getElementById('homeDone').textContent=S.done;if(document.getElementById('homeAch'))document.getElementById('homeAch').textContent=S.ach.length;if(document.getElementById('pXP'))document.getElementById('pXP').textContent=S.xp;if(document.getElementById('pDone'))document.getElementById('pDone').textContent=S.done;if(document.getElementById('pWrong'))document.getElementById('pWrong').textContent=S.wrong.filter(x=>!x.master).length}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));let p=document.getElementById(id);if(p)p.classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));window.scrollTo({top:0,behavior:'smooth'});if(id==='wrong')renderWrong();if(id==='progress')renderProgress();if(id==='today')renderToday()}document.getElementById('nav').innerHTML=NAV.map(x=>`<button data-id="${x[0]}" onclick="show('${x[0]}')">${x[1]}</button>`).join('');
const shell={home:`<section class="page active" id="home"><div class="hero purple"><h1>Welcome back, Vicky 👋</h1><p>这里是一套可以长期使用的个人英语 RPG。你可以自由选关，也可以按推荐路线升级。</p><button class="btn" onclick="show('today')">⚔️ 开始冒险</button></div><div class="grid g4"><div class="card">⭐ XP<div class="stat" id="homeXP">0</div></div><div class="card">📕 错题<div class="stat" id="homeWrong">0</div></div><div class="card">⚔️ 训练<div class="stat" id="homeDone">0</div></div><div class="card">🏆 成就<div class="stat" id="homeAch">0</div></div></div><div class="grid g3" style="margin-top:14px"><div class="card"><h3>🎯 你的主线</h3><p>基础 → 日常 → 职场 → 翻译 → CATTI</p></div><div class="card"><h3>👹 打怪规则</h3><p>做错不会消失，会进入错题本并反复出现。</p></div><div class="card"><h3>🌱 低压力</h3><p>10分钟也算。今天只打一个小怪也可以。</p></div></div></section>`,today:`<section class="page" id="today"><div class="hero"><h1>☀️ Today's Quest</h1><p>自由选择，不要求全部完成。</p><div class="bar"><i id="todayFill" style="width:0"></i></div><p id="todayInfo" class="small"></p></div><div id="todayList"></div></section>`,map:`<section class="page" id="map"><div class="hero purple"><h1>🗺️ English World</h1><p>每个区域都是一个能力。XP 越高，解锁越多。</p></div><div class="map" id="mapList"></div></section>`,vocab:`<section class="page" id="vocab"><div class="hero"><h1>📚 Vocabulary Center</h1><p>自由选择词库、等级、数量和模式。</p><div class="toolbar"><select class="select" id="vb"><option value="basic">基础高频</option><option value="daily">日常生活</option><option value="business">商务外贸</option><option value="tech">科技社会</option><option value="catti">CATTI</option></select><select class="select" id="va"><option>5</option><option>10</option><option>20</option></select><button class="modebtn active" onclick="vm='ec';vmodes(this)">英→中</button><button class="modebtn" onclick="vm='ce';vmodes(this)">中→英</button><button class="modebtn" onclick="vm='spell';vmodes(this)">拼写</button><button class="modebtn" onclick="vm='listen';vmodes(this)">听辨</button><button class="btn" onclick="startVocab()">开始打怪</button></div></div><div class="card" id="vg"></div></section>`,grammar:`<section class="page" id="grammar"><div class="hero"><h1>🧟 Grammar Center</h1><div class="toolbar"><select class="select" id="gm"><option value="choice">选择题</option><option value="fill">填空</option><option value="correct">改错</option></select><button class="btn" onclick="startGrammar()">开始</button></div></div><div class="card" id="gg"></div></section>`,listen:`<section class="page" id="listen"><div class="hero"><h1>🎧 Listening Center</h1><p>不是只有一段固定音频。先选资源和模式。</p><div class="toolbar"><select class="select" id="lb"><option>日常对话</option><option>职场英语</option><option>外贸英语</option><option>故事</option><option>国际英语</option></select><select class="select" id="lm"><option value="pure">纯听</option><option value="cn">听英→写中</option><option value="en">听英→写英</option><option value="gap">填空</option></select><button class="btn" onclick="startListen()">开始</button></div></div><div class="card" id="lg"></div></section>`,speak:`<section class="page" id="speak"><div class="hero"><h1>🗣️ Speaking Center</h1><div class="toolbar"><select class="select" id="ss"><option>日常寒暄</option><option>客户询价</option><option>价格谈判</option><option>交期沟通</option><option>报价跟进</option><option>会议</option><option>面试</option><option>旅行</option></select><select class="select" id="sm"><option>跟读</option><option>中译英</option><option>场景对话</option><option>自由回答</option></select><button class="btn" onclick="startSpeak()">开始</button></div></div><div class="card" id="sg"></div></section>`,read:`<section class="page" id="read"><div class="hero"><h1>📖 Reading Center</h1><p>从简单句子逐渐过渡到段落和文章。</p><button class="btn" onclick="startRead()">开始阅读</button></div><div class="card" id="rg"></div></section>`,write:`<section class="page" id="write"><div class="hero"><h1>✍️ Writing Workshop</h1><p>先写自己的答案，提交之后才看参考。</p><button class="btn" onclick="startWrite()">开始写作</button></div><div class="card" id="wg"></div></section>`,trans:`<section class="page" id="trans"><div class="hero"><h1>🌍 Translation Tower</h1><div class="toolbar"><select class="select" id="td"><option value="ce">中→英</option><option value="ec">英→中</option></select><button class="btn" onclick="startTrans()">开始挑战</button></div></div><div class="card" id="tg"></div></section>`,catti:`<section class="page" id="catti"><div class="hero purple"><h1>👹 CATTI Boss</h1><p>三级笔译长期挑战。先做题，再看参考和分析。</p><button class="btn" onclick="startTrans(true)">⚔️ 挑战 Boss</button></div><div class="card" id="tg2"></div></section>`,media:`<section class="page" id="media"><div class="hero"><h1>🎬 Media World</h1><p>影视、故事、音乐和真实英语资源入口。</p></div><div class="library"><div class="resource"><h3>📺 Friends 风格</h3><p>日常对话、口语、跟读、角色扮演。</p></div><div class="resource"><h3>🗽 走遍美国风格</h3><p>生活场景、听力、词汇、表达。</p></div><div class="resource"><h3>🎵 Music English</h3><p>歌词理解、听辨、发音和表达。</p></div><div class="resource"><h3>📖 Story English</h3><p>短故事、分句听力、复述。</p></div><div class="resource"><h3>💼 Foreign Trade</h3><p>报价、交期、材料、模具、客户沟通。</p></div><div class="resource"><h3>🌎 International English</h3><p>经济、科技、社会、全球化。</p></div></div></section>`,wrong:`<section class="page" id="wrong"><div class="hero"><h1>📕 Wrong Answer Book</h1><p>错题不会因为做过一次就消失。真正掌握后再标记。</p><button class="btn alt" onclick="reviewWrong()">🔥 优先复习最弱项</button></div><div id="wrongList"></div></section>`,review:`<section class="page" id="review"><div class="hero"><h1>🔁 Review Center</h1><p>今天不知道学什么？就从错题开始。</p><button class="btn" onclick="reviewWrong()">开始复习</button></div></section>`,progress:`<section class="page" id="progress"><div class="hero"><h1>🏆 Progress</h1><div class="grid g3"><div>XP<div class="stat" id="pXP">0</div></div><div>训练次数<div class="stat" id="pDone">0</div></div><div>未掌握错题<div class="stat" id="pWrong">0</div></div></div><div class="bar"><i id="pbar" style="width:0"></i></div><p id="ptext"></p></div><div class="card"><h3>成就</h3><div id="achList"></div></div></section>`,relax:`<section class="page" id="relax"><div class="hero"><h1>🌙 Relax English</h1><p>累了就不要硬学。听个小故事，也算和英语保持联系。</p><button class="btn" onclick="relaxStory()">打开故事</button></div><div class="card" id="relaxBox"></div></section>`,settings:`<section class="page" id="settings"><div class="hero"><h1>⚙️ Settings</h1><p>数据默认保存在当前浏览器。</p><button class="btn" onclick="exportData()">⬇️ 导出学习数据</button> <button class="btn alt" onclick="importData()">⬆️ 导入学习数据</button> <button class="btn gray" onclick="resetData()">清空数据</button><p class="small">注意：GitHub Pages 这个版本没有服务器账号系统，因此不同设备之间不会自动同步。</p></div></section>`};
document.getElementById('app').innerHTML=Object.values(shell).join('');
const V={basic:[['book','书'],['water','水'],['work','工作'],['family','家庭'],['friend','朋友'],['learn','学习'],['important','重要的'],['different','不同的'],['change','改变'],['world','世界']],daily:[['morning','早晨'],['breakfast','早餐'],['station','车站'],['ticket','票'],['shopping','购物'],['weather','天气'],['weekend','周末'],['busy','忙碌的'],['helpful','有帮助的'],['comfortable','舒服的']],business:[['quotation','报价'],['drawing','图纸'],['material','材料'],['lead time','交期'],['delivery','交付'],['customer','客户'],['supplier','供应商'],['quality','质量'],['production','生产'],['price','价格']],tech:[['technology','技术'],['innovation','创新'],['digital','数字的'],['sustainable','可持续的'],['development','发展'],['society','社会'],['globalization','全球化'],['interdependence','相互依存'],['opportunity','机会'],['environment','环境']],catti:[['contribute','贡献'],['recovery','复苏'],['sustainable','可持续的'],['innovation','创新'],['interdependence','相互依存'],['cooperation','合作'],['economic','经济的'],['significant','重要的'],['challenge','挑战'],['promote','促进']]};
let vm='ec',VI=0,VQ=[];
function startVocab(){let b=document.getElementById('vb').value,n=+document.getElementById('va').value,arr=V[b]||V.basic;VQ=[];for(let i=0;i<n;i++)VQ.push(arr[i%arr.length]);VI=0;vc()}
function vmodes(x){document.querySelectorAll('#vocab .modebtn').forEach(b=>b.classList.remove('active'));x.classList.add('active')}
function vc(){if(VI>=VQ.length){document.getElementById('vg').innerHTML='<div class="center"><h2>🎉 词汇关完成！</h2><p>这一关全部打完了。</p></div>';return}let x=VQ[VI],q=vm==='ec'?x[0]:x[1];if(vm==='listen')q='🔊 听音后选择对应单词';document.getElementById('vg').innerHTML=`<div class="monster">🐛</div><div class="small">第 ${VI+1}/${VQ.length}</div><div class="question">${q}</div><div class="choices"><button class="choice" onclick="vans('${x[1]}')">${x[1]}</button><button class="choice" onclick="vans('错误答案')">错误答案</button><button class="choice" onclick="vans('${x[0]}')">${x[0]}</button><button class="choice" onclick="vans('不知道')">不知道</button></div><div id="vf"></div>`;if(vm==='listen')speak(x[0])}
function vans(a){let x=VQ[VI],correct=vm==='ec'||vm==='listen'?x[1]:x[0];if(a===correct){document.getElementById('vf').innerHTML='<div class="feedback good">✓ 正确！</div>';gain(10);setTimeout(()=>{VI++;vc()},500)}else{addWrong('vocab',x[0],a,correct,'重点记住单词的含义、拼写和常见搭配。');document.getElementById('vf').innerHTML='<div class="feedback bad">✗ 再记一次。参考：'+correct+'</div>';setTimeout(()=>{VI++;vc()},800)}}
const G=[['She ___ to work every day.',['go','goes','going','gone'],'goes','第三人称单数一般现在时，主语 She 后用 goes。'],['I ___ this book yesterday.',['read','reads','reading','have read'],'read','yesterday 表示过去时间，这里用一般过去时。'],['We have ___ the quotation.',['send','sent','sending','sends'],'sent','have 后面使用过去分词 sent。'],['If it rains, we ___ at home.',['stay','stayed','will stay','staying'],'will stay','真实条件句常用 if + 一般现在时，主句用 will。']];
let GI=0;
function startGrammar(){GI=Math.floor(Math.random()*G.length);let x=G[GI],m=document.getElementById('gm').value;document.getElementById('gg').innerHTML=`<div class="monster">🧟</div><span class="tag">${m}</span><div class="question">${x[0]}</div><div class="choices">${x[1].map(y=>`<button class="choice" onclick="gans('${y}')">${y}</button>`).join('')}</div><div id="gf"></div>`}
function gans(a){let x=G[GI];if(a===x[2]){document.getElementById('gf').innerHTML=`<div class="feedback good">✓ 正确！<br>${x[3]}</div>`;gain(12)}else{addWrong('grammar',x[0],a,x[2],x[3]);document.getElementById('gf').innerHTML=`<div class="feedback bad">✗ 再想想。<br>参考答案：${x[2]}<br>${x[3]}</div>`}}
const L=[['Hi, how are you doing today?','你好，今天怎么样？'],['Could you please send us your best price?','你能给我们最优惠的价格吗？'],['The lead time is about six weeks after order confirmation.','确认订单后交期大约是六周。'],['Technological innovation is changing the way we live.','技术创新正在改变我们的生活方式。']];
let LD;
function startListen(){LD=L[Math.floor(Math.random()*L.length)];let m=document.getElementById('lm').value;document.getElementById('lg').innerHTML=`<div class="monster">👂</div><div class="question">听下面的句子</div><button class="btn" onclick="speak('${LD[0].replace(/'/g,"\\'")}')">🔊 播放</button><textarea id="la" placeholder="${m==='pure'?'听完后写下你听到的重点（可选）':m==='cn'?'听英语后写中文':'听英语后写英语'}"></textarea><button class="btn" onclick="lans('${m}')">提交</button><div id="lr"></div>`}
function lans(m){let a=document.getElementById('la').value.trim();if(m==='pure'){document.getElementById('lr').innerHTML='<div class="feedback good">✓ 完成一次精听。可以再听 2–3 遍。</div>';gain(15);return}let ok=similar(a,m==='cn'?LD[1]:LD[0])>.5;if(ok){document.getElementById('lr').innerHTML='<div class="feedback good">✓ 听力击败！<br>'+LD[1]+'<br>'+LD[2]+'</div>';gain(15)}else{addWrong('listening',LD[1],a,m==='cn'?LD[2]:LD[1],'再听：先抓关键词，再听整体。');document.getElementById('lr').innerHTML='<div class="feedback bad">✗ 再听一次。<br>参考：'+(m==='cn'?LD[2]:LD[1])+'</div>'}}
function speechTry(e){if(!('SpeechRecognition'in window||'webkitSpeechRecognition'in window)){toast('浏览器不支持语音识别');return}let R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R;r.lang='en-US';r.onresult=x=>{let a=x.results[0][0].transcript;let ok=similar(a,e)>.55;document.getElementById('lr').innerHTML='<div class="feedback '+(ok?'good':'bad')+'">识别：'+a+'<br>目标：'+e+'</div>';ok?gain(15):addWrong('speaking',e,a,e,'注意重音、连读和节奏。')};r.start()}
function similar(a,b){a=norm(a);b=norm(b);let s=0;for(let c of a)if(b.includes(c))s++;return s/Math.max(a.length,b.length)}
const SP={'日常寒暄':['Hi, how are you doing today?','你好，今天怎么样？'],'客户询价':['Could you please send us your best price?','你能给我们最优惠的价格吗？'],'价格谈判':['Our current price is already very competitive.','我们目前的价格已经很有竞争力了。'],'交期沟通':['The lead time is about six weeks after order confirmation.','确认订单后交期大约是六周。'],'报价跟进':['May I ask if you have had a chance to review our quotation?','请问您有机会看过我们的报价了吗？'],'会议':['Could we discuss the main points first?','我们可以先讨论重点吗？'],'面试':['Could you tell me about your previous experience?','你能介绍一下你之前的工作经验吗？'],'旅行':['Could you tell me how to get to the station?','你能告诉我怎么去车站吗？']};
function startSpeak(){let d=SP[document.getElementById('ss').value],m=document.getElementById('sm').value,show=m==='中译英'?d[1]:d[0];document.getElementById('sg').innerHTML=`<div class="monster">🗣️</div><span class="tag">${m}</span><div class="question">${show}</div><button class="btn" onclick="speak('${d[0].replace(/'/g,"\\'")}')">🔊 听</button><button class="btn alt" onclick="speechTry('${d[0].replace(/'/g,"\\'")}')">🎙️ 开口</button><button class="btn gray" onclick="document.getElementById('sr').classList.remove('hidden')">看参考</button><div id="sr" class="ref hidden">参考表达：<b>${d[0]}</b><br>${d[1]}</div>`}
const R=[['Technology has become an important part of modern society. It has changed the way people work, communicate and learn.','科技已经成为现代社会的重要组成部分。它改变了人们工作、交流和学习的方式。'],['Globalization has made countries more closely connected. This interdependence creates opportunities, but it also requires people to understand different cultures.','全球化使各国联系更加紧密。这种相互依存带来了机会，同时也要求人们理解不同文化。']];
function startRead(){let x=R[Math.floor(Math.random()*R.length)];document.getElementById('rg').innerHTML=`<h3>📖 Reading Quest</h3><p style="font-size:18px;line-height:1.9">${x[0]}</p><button class="btn" onclick="speak('${x[0].replace(/'/g,"\\'")}')">🔊 听文章</button><hr><p>用中文写大意：</p><textarea id="ra"></textarea><button class="btn" onclick="let a=document.getElementById('ra').value;if(a.length>=12){gain(18);document.getElementById('rf').innerHTML='<div class=\"feedback good\">✓ 完成。重点抓主旨和逻辑。</div>'}else document.getElementById('rf').innerHTML='<div class=\"feedback bad\">再写完整一点。</div>'">提交</button><div id="rf"></div><div class="ref">参考理解：${x[1]}</div>`}
const W=[['请将“我们会在确认图纸后开始准备报价。”翻译成英文。','We will start preparing the quotation after confirming the drawing.'],['客户问为什么你们价格较高。写一封简短、友好、不强势的英文回复。','Thank you for your feedback. Our price is based on the material, processing requirements and quality control. We would be happy to discuss the specifications and see if there is any room to optimize the cost.'],['请将“科技创新正在改变我们的生活方式。”翻译成英文。','Technological innovation is changing the way we live.']];
let WX;
function startWrite(){WX=W[Math.floor(Math.random()*W.length)];document.getElementById('wg').innerHTML=`<div class="question">${WX[0]}</div><textarea id="wa" placeholder="先自己写，提交后才显示参考。"></textarea><button class="btn" onclick="wc()">提交</button><div id="wf"></div>`}
function wc(){let a=document.getElementById('wa').value.trim();if(!a){toast('先写答案');return}let sc=Math.min(100,Math.round(similar(a,WX[1])*65+(a.length/WX[1].length)*35));let good=sc>=55;document.getElementById('wf').innerHTML=`<div class="feedback ${good?'good':'bad'}"><b>学习评分：${sc}/100</b><br>${good?'核心信息基本到位。':'需要继续练习。'}<br><b>参考：</b>${WX[1]}<br><b>分析：</b>检查时态、主谓一致、介词、搭配、语气和中文直译。</div>`;if(good)gain(20);else addWrong('writing',WX[0],a,WX[1],'重点检查语法、搭配和自然表达。')}
const T=[['中国经济保持了稳定增长，为全球经济复苏作出了重要贡献。','China’s economy has maintained stable growth and made an important contribution to the global economic recovery.'],['Technological innovation has become an important driver of sustainable development.','技术创新已成为可持续发展的重要动力。'],['Globalization has increased interdependence among countries and created new opportunities for cooperation.','全球化加深了各国之间的相互依存，也创造了新的合作机会。']];
let TX;
function startTrans(boss=false){let dir=boss?(Math.random()>.5?'ce':'ec'):document.getElementById('td').value;TX=T[Math.floor(Math.random()*T.length)];let src=dir==='ce'?TX[0]:TX[1],ref=dir==='ce'?TX[1]:TX[0];document.getElementById(boss?'tg2':'tg').innerHTML=`<div class="monster">${boss?'👹':'🌍'}</div><div class="question">${src}</div><textarea id="ta" placeholder="先翻译，提交后才显示参考。"></textarea><button class="btn" onclick="tc('${ref.replace(/'/g,"\\'")}','${src.replace(/'/g,"\\'")}')">提交</button><div id="tf"></div>`}
function tc(ref,src){let a=document.getElementById('ta').value.trim();if(!a){toast('先写翻译');return}let sc=Math.min(100,Math.round(similar(a,ref)*65+(a.length/ref.length)*35));let good=sc>=55;document.getElementById('tf').innerHTML=`<div class="feedback ${good?'good':'bad'}"><b>学习评分：${sc}/100</b><br>${good?'核心意思基本到位。':'重点复习句子结构和核心术语。'}<br><b>参考：</b>${ref}<br><b>分析：</b>对比忠实度、语法、搭配、自然度和术语。<br><b>核心表达：</b>${ref.split(' ').slice(0,9).join(' ')}</div>`;good?gain(25):addWrong('translation',src,a,ref,'翻译重点：忠实、通顺、地道和术语。')}
function addWrong(type,q,user,ans,why){let key=type+'|'+q;let x=S.wrong.find(z=>z.key===key);if(x){x.count++;x.user=user}else{S.wrong.push({key,type,q,user,ans,why,count:1,master:false})}save();toast('📕 已加入错题本')}
function norm(s){return String(s).toLowerCase().replace(/[^\w\u4e00-\u9fff]/g,'')}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}}
function achievements(){S.ach=S.ach||[];if(S.done>=1&&!S.ach.includes('first'))S.ach.push('first');if(S.done>=10&&!S.ach.includes('ten'))S.ach.push('ten');if(S.xp>=500&&!S.ach.includes('xp500'))S.ach.push('xp500');if(S.wrong.length>=5&&!S.ach.includes('wrong'))S.ach.push('wrong');if(lvl()>=10&&!S.ach.includes('level10'))S.ach.push('level10')}
function renderWrong(){let arr=S.wrong.filter(x=>!x.master);document.getElementById('wrongList').innerHTML=arr.length?arr.sort((a,b)=>b.count-a.count).map((x,i)=>`<div class="wrongitem"><b>👹 ${x.type} · 错 ${x.count} 次</b><p>${x.q}</p><p class="small">你的答案：${x.user||'—'}</p><p><b>参考：</b>${x.ans}</p><p class="small"><b>为什么：</b>${x.why}</p><button class="btn alt" onclick="master('${x.key.replace(/'/g,"\\'")}')">标记已掌握</button></div>`).join(''):'<div class="card center"><h2>🎉 错题本空了</h2><p>继续挑战新的怪物！</p></div>'}
function master(k){let x=S.wrong.find(z=>z.key===k);if(x){x.master=true;save();renderWrong();toast('✓ 已掌握')}}
function clearMastered(){renderWrong()}
function reviewWrong(){let x=S.wrong.filter(z=>!z.master).sort((a,b)=>b.count-a.count)[0];if(!x){show('wrong');return}if(x.type==='vocab'){show('vocab');startVocab()}else if(x.type==='grammar'){show('grammar');startGrammar()}else if(x.type==='listening'){show('listen');startListen()}else if(x.type==='writing'){show('write');startWrite()}else{show('trans');startTrans()}toast('🔥 优先复习：'+x.q.slice(0,22))}
function renderToday(){let tasks=[['📚','词汇','vocab',10],['📝','语法','grammar',12],['🎧','听力','listen',15],['🗣️','口语','speak',15],['🌍','翻译','trans',25]];document.getElementById('todayList').innerHTML=tasks.map(x=>`<div class="quest"><div><b>${x[0]} ${x[1]}</b><div class="small">+${x[3]} XP</div></div><button class="btn alt" onclick="show('${x[2]}');${x[2]==='vocab'?'startVocab()':x[2]==='grammar'?'startGrammar()':x[2]==='listen'?'startListen()':x[2]==='speak'?'startSpeak()':'startTrans()'}">挑战</button></div>`).join('');let d=Object.keys(S.todayDone||{}).length;document.getElementById('todayFill').style.width=d/5*100+'%';document.getElementById('todayInfo').textContent=d+'/5 今日主线完成'}
function renderMap(){let z=[['🌱','新手村','基础词汇、基础语法','vocab'],['🏠','日常村','日常听说','speak'],['🏙️','英语城','语法、阅读、写作','grammar'],['💼','职场城','外贸与商务','speak'],['🌎','国际大陆','科技、经济、社会','read'],['🗼','翻译高塔','中英互译','trans'],['👹','CATTI Boss','三级笔译挑战','catti'],['🎬','影视世界','影视风格听说','media'],['🏆','大师之路','错题与长期复习','review']];document.getElementById('mapList').innerHTML=z.map((x,i)=>`<div class="zone ${i>2&&S.xp<100?'locked':''}"><div><div class="monster">${x[0]}</div><h3>${x[1]}</h3><p class="small">${x[2]}</p></div><button class="btn alt" onclick="${i>2&&S.xp<100?'toast(\'先积累100 XP解锁\')':`show('${x[3]}')`}">${i>2&&S.xp<100?'🔒':'进入'}</button></div>`).join('')}
function renderProgress(){document.getElementById('pXP').textContent=S.xp;document.getElementById('pDone').textContent=S.done;document.getElementById('pWrong').textContent=S.wrong.filter(x=>!x.master).length;let n=S.xp%100;document.getElementById('pbar').style.width=n+'%';document.getElementById('ptext').textContent=`Lv.${lvl()} · ${n}/100 XP 到下一等级`;let names={first:'🌱 第一次打怪',ten:'⚔️ 10次训练',xp500:'⭐ 500 XP',wrong:'📕 错题猎人',level10:'👹 Lv.10 Boss门票'};document.getElementById('achList').innerHTML=Object.keys(names).map(k=>`<span class="tag">${S.ach.includes(k)?'🏆':'🔒'} ${names[k]}</span>`).join('')}
function relaxStory(){document.getElementById('relaxBox').innerHTML='<div class="ref"><h3>🌙 Tiny Story</h3><p>Every day, Vicky learned a little English. Some days were difficult. Some days were easy. But she kept going. One sentence, one word, one small victory at a time.</p><p>每天学一点。有时候很难，有时候很轻松，但继续就好。</p><button class="btn" onclick="speak(\'One sentence, one word, one small victory at a time.\')">🔊 听一遍</button></div>'}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vickys-english-data.json';a.click()}
function importData(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader;r.onload=()=>{try{S=JSON.parse(r.result);save();toast('导入成功')}catch(e){toast('文件格式错误')}};r.readAsText(i.files[0])};i.click()}
function resetData(){if(confirm('确定清空 V3 全部学习数据吗？')){localStorage.removeItem('VickysEnglishV3');location.reload()}}
function startTask(x){show(x==='catti'?'catti':x);if(x==='vocabulary')startVocab();if(x==='grammar')startGrammar();if(x==='listening')startListen();if(x==='speaking')startSpeak();if(x==='catti')startTrans(true)}
show('home');renderMap();update();dayInit();update();
</script></body></html>
