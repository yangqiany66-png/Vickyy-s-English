<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#fafafa;
  color:#222;
}

button,input,select,textarea{
  font:inherit;
}

a{
  -webkit-tap-highlight-color:transparent;
}

.media-v5{
  display:grid;
  gap:18px;
  max-width:1200px;
  margin:0 auto;
  padding:22px 16px 50px;
}

.media-hero{
  padding:24px;
  border-radius:22px;
  background:linear-gradient(135deg,#eef7ff,#f8f4ff);
  border:1px solid rgba(100,100,180,.12);
}

.media-hero h2{
  margin:0 0 8px;
  font-size:25px;
}

.media-hero p{
  margin:0;
  color:#666;
  line-height:1.7;
}

.media-stats{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:16px;
}

.media-stat{
  background:rgba(255,255,255,.85);
  padding:9px 13px;
  border-radius:12px;
  font-size:13px;
}

.media-filter{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.media-filter button{
  border:0;
  padding:9px 15px;
  border-radius:999px;
  background:#f1f1f5;
  cursor:pointer;
}

.media-filter button.active{
  background:#222;
  color:white;
}

.media-search{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.media-search input{
  flex:1;
  min-width:220px;
  padding:12px 14px;
  border:1px solid #ddd;
  border-radius:12px;
  background:white;
}

.media-search select{
  padding:12px 14px;
  border:1px solid #ddd;
  border-radius:12px;
  background:white;
}

.media-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px;
}

.media-card-v5{
  background:white;
  border:1px solid #e8e8ee;
  border-radius:20px;
  padding:19px;
  box-shadow:0 5px 20px rgba(0,0,0,.04);
  transition:.2s;
}

.media-card-v5:hover{
  transform:translateY(-2px);
  box-shadow:0 9px 25px rgba(0,0,0,.07);
}

.media-icon{
  font-size:30px;
  margin-bottom:8px;
}

.media-card-v5 h3{
  margin:5px 0;
}

.media-org{
  font-size:13px;
  color:#888;
}

.media-desc{
  color:#666;
  line-height:1.6;
  font-size:14px;
  min-height:45px;
}

.media-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:12px 0;
}

.media-tag{
  background:#f4f4f7;
  padding:5px 9px;
  border-radius:8px;
  font-size:12px;
}

.media-level{
  background:#fff3d9;
  color:#9a6700;
}

.media-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.media-actions button,
.media-actions a{
  border:0;
  padding:9px 12px;
  border-radius:10px;
  cursor:pointer;
  text-decoration:none;
  font-size:13px;
}

.media-main-btn{
  background:#222;
  color:white !important;
}

.media-secondary-btn{
  background:#f1f1f5;
  color:#333;
}

.media-done-btn{
  background:#eef8ef;
  color:#237a35;
}

.media-done-btn.done{
  background:#dff5e3;
}

.media-progress{
  height:7px;
  background:#eee;
  border-radius:99px;
  overflow:hidden;
  margin:12px 0;
}

.media-progress span{
  display:block;
  height:100%;
  width:0;
  background:#222;
  transition:.25s;
}

.media-lessons{
  margin-top:14px;
  border-top:1px solid #eee;
  padding-top:14px;
}

.media-lessons-title{
  font-weight:700;
  margin-bottom:10px;
}

.media-lesson-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:8px;
}

.media-lesson{
  display:block;
  padding:10px;
  border-radius:10px;
  background:#f7f7f9;
  text-decoration:none;
  color:#333;
  font-size:13px;
}

.media-lesson:hover{
  background:#ececf1;
}

.media-lesson.done{
  background:#e9f8ec;
  color:#207337;
}

.lesson-no{
  font-weight:700;
  margin-right:5px;
}

.media-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.media-modal.show{
  display:flex;
}

.media-modal-box{
  width:min(860px,100%);
  max-height:92vh;
  overflow-y:auto;
  background:white;
  border-radius:22px;
  padding:24px;
}

.media-modal-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.media-close{
  border:0;
  background:#f2f2f4;
  width:36px;
  height:36px;
  border-radius:50%;
  cursor:pointer;
}

.study-modes{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
  margin-top:18px;
}

.study-mode{
  padding:15px;
  border-radius:14px;
  background:#f7f7f9;
  cursor:pointer;
  border:1px solid transparent;
}

.study-mode:hover{
  border-color:#ddd;
}

.study-mode strong{
  display:block;
  margin-bottom:5px;
}

.study-mode span{
  color:#777;
  font-size:12px;
}

.mode-panel{
  margin-top:16px;
  padding:16px;
  border:1px solid #eee;
  border-radius:15px;
  background:#fff;
}

.mode-panel h4{
  margin:0 0 8px;
}

.check-list{
  display:grid;
  gap:9px;
  margin-top:12px;
}

.check-list label{
  display:flex;
  gap:9px;
  align-items:flex-start;
  background:#f7f7f9;
  padding:10px;
  border-radius:10px;
}

.note-area{
  width:100%;
  min-height:130px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  resize:vertical;
}

.player-card{
  background:#111;
  color:white;
  border-radius:18px;
  padding:18px;
  margin-top:18px;
}

.player-note{
  font-size:12px;
  color:#bbb;
  line-height:1.6;
}

.player-controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.player-controls button{
  border:0;
  border-radius:9px;
  padding:8px 11px;
  cursor:pointer;
}

.empty{
  padding:30px;
  text-align:center;
  color:#777;
  background:white;
  border-radius:18px;
  border:1px solid #eee;
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#222;
  color:white;
  padding:12px 15px;
  border-radius:12px;
  z-index:10000;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

@media(max-width:600px){

  .media-v5{
    padding:12px 10px 35px;
  }

  .media-hero{
    padding:18px;
  }

  .media-hero h2{
    font-size:21px;
  }

  .media-card-v5{
    padding:16px;
  }

  .media-actions a,
  .media-actions button{
    flex:1;
    text-align:center;
    min-width:110px;
  }

  .media-modal{
    padding:8px;
  }

  .media-modal-box{
    padding:17px;
    border-radius:18px;
  }
}
</style>

function getJSON(key,fallback){

  try{
    return JSON.parse(localStorage.getItem(key)) ?? fallback;
  }catch(e){
    return fallback;
  }

}


function saveJSON(key,value){

  localStorage.setItem(key,JSON.stringify(value));

}


function getDone(){

  return getJSON(STORAGE.done,[]);

}


function getNotes(){

  return getJSON(STORAGE.notes,{});

}


function getModes(){

  return getJSON(STORAGE.mode,{});

}


function getXP(){

  return Number(localStorage.getItem(STORAGE.xp)||0);

}


function addXP(number){

  const xp=getXP()+number;

  localStorage.setItem(STORAGE.xp,String(xp));

  toast("⚡ +"+number+" XP");

}


function toast(text){

  const el=document.getElementById("toast");

  el.textContent=text;

  el.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer=setTimeout(()=>{

    el.classList.remove("show");

  },1800);

}


function isDone(id){

  return getDone().includes(id);

}


function completeResource(id){

  const done=getDone();

  if(done.includes(id)){

    toast("已经完成过啦");

    return;

  }

  done.push(id);

  saveJSON(STORAGE.done,done);

  addXP(20);

  renderMediaV5();

}


function toggleLessonDone(number){

  const key="voa1-"+number;

  const done=getDone();

  const index=done.indexOf(key);

  if(index>=0){

    done.splice(index,1);

  }else{

    done.push(key);

    addXP(5);

  }

  saveJSON(STORAGE.done,done);

  renderMediaV5();

}


function modeText(mode){

  const map={

    "观看":"打开官方视频或课程，先完整看一遍，不急着查词。",

    "精听":"第一遍不看字幕；第二遍结合官方 Transcript；第三遍暂停复听。",

    "跟读":"一句一句播放并跟读，模仿节奏、重音、连读和语音。",

    "词汇":"记录真正影响理解的词和短语，不需要一次背太多。",

    "Transcript":"使用官方课程页面提供的 Transcript 或文本。",

    "练习":"完成官方页面提供的练习、Quiz 或 Worksheet。",

    "表达":"摘出 3–5 个可以主动使用的表达并自己造句。",

    "口语":"听一句 → 暂停 → 复述 → 再播放比较。",

    "写作":"完成官方写作任务，再回到 Vicky's English 记录。",

    "52课":"从 Lesson 1–52 选择当前课程，一课一课完成。",

    "课程":"进入官方课程主页，从适合自己的课程开始。",

    "电影":"观看电影片段，注意真实语境中的表达。",

    "短视频":"一分钟一条，先听整体，再精听关键词。",

    "新闻":"先听标题和大意，再精听细节。",

    "视频":"选择一条真实视频进行听力训练。",

    "听力":"先听大意，再进行第二遍精听。",

    "阅读":"先独立阅读，再听对应内容。",

    "语法":"学习规则后立即做题或自己造句。",

    "发音":"模仿原音，重点练重音、节奏和连读。",

    "CATTI":"记录正式表达、固定搭配和适合笔译的句型。",

    "知识":"先理解视频主题，再处理语言。",

    "文化":"先理解文化背景，再学习其中的英语表达。"

  };

  return map[mode] || "完成一轮本模式学习。";

}


function renderVOALessons(){

  const done=getDone();

  const completed=VOA_L1.filter(
    lesson=>done.includes("voa1-"+lesson[0])
  ).length;

  return `

  <div class="media-lessons">

    <div class="media-lessons-title">

      🇺🇸 52 Lessons · 已完成 ${completed}/52

    </div>

    <div class="media-lesson-list">

      ${VOA_L1.map(lesson=>{

        const finished=done.includes("voa1-"+lesson[0]);

        return `

        <div>

          <a
            class="media-lesson ${finished?"done":""}"
            href="${lesson[2]}"
            target="_blank"
            rel="noopener">

            <span class="lesson-no">

              ${finished?"✓":"Lesson "+lesson[0]}

            </span>

            ${lesson[1]}

          </a>

          <button
            style="margin-top:4px;border:0;background:transparent;cursor:pointer;font-size:12px"
            onclick="toggleLessonDone('${lesson[0]}')">

            ${finished?"取消完成":"✓ 标记完成 +5 XP"}

          </button>

        </div>

        `;

      }).join("")}

    </div>

  </div>

  `;

}


function renderCard(item){

  const done=isDone(item.id);

  let progress=done?100:0;

  if(item.id==="voa-l1"){

    progress=Math.round(

      VOA_L1.filter(
        lesson=>isDone("voa1-"+lesson[0])
      ).length/52*100

    );

  }

  return `

  <article class="media-card-v5">

    <div class="media-icon">
      ${item.icon}
    </div>

    <h3>${item.name}</h3>

    <div class="media-org">
      ${item.org}
    </div>

    <p class="media-desc">
      ${item.desc}
    </p>

    <div class="media-tags">

      <span class="media-tag media-level">
        ${item.level}
      </span>

      ${item.modes.slice(0,4).map(
        mode=>`<span class="media-tag">${mode}</span>`
      ).join("")}

    </div>

    <div class="media-progress">

      <span style="width:${progress}%"></span>

    </div>

    <div class="media-actions">

      <a
        class="media-main-btn"
        href="${item.url}"
        target="_blank"
        rel="noopener">

        打开官方资源 ↗

      </a>

      <button
        class="media-secondary-btn"
        onclick="openMedia('${item.id}')">

        学习模式

      </button>

      <button
        class="media-done-btn ${done?"done":""}"
        onclick="completeResource('${item.id}')">

        ${done?"✓ 已完成":"+ 完成资源"}

      </button>

    </div>

    ${item.id==="voa-l1"?renderVOALessons():""}

  </article>

  `;

}


function renderMediaV5(filter="全部"){

  const search=
    (document.getElementById("mediaSearch")?.value||"")
    .trim()
    .toLowerCase();

  const level=
    document.getElementById("mediaLevel")?.value||"全部";

  const list=MEDIA_RESOURCES.filter(item=>{

    const text=(
      item.name+
      " "+
      item.org+
      " "+
      item.desc+
      " "+
      item.level
    ).toLowerCase();

    const matchesSearch=
      !search||
      text.includes(search);

    const matchesLevel=
      level==="全部"||
      item.level.includes(level);

    let matchesFilter=true;

    if(filter==="已完成"){

      matchesFilter=isDone(item.id);

    }else if(filter==="VOA"){

      matchesFilter=item.org.includes("VOA");

    }else if(filter==="BBC"){

      matchesFilter=item.org==="BBC";

    }else if(filter==="British Council"){

      matchesFilter=item.org==="British Council";

    }else if(["A1","B1","B2"].includes(filter)){

      matchesFilter=item.level.includes(filter);

    }

    return matchesSearch&&matchesLevel&&matchesFilter;

  });

  const container=
    document.getElementById("mediaV5Container");

  if(!list.length){

    container.innerHTML=
      '<div class="empty">没有找到匹配资源。</div>';

    return;

  }

  container.innerHTML=
    '<div class="media-grid">'+
    list.map(renderCard).join("")+
    '</div>';

}

let speechRate=1;

let currentSpeech=null;


function selectMode(id,mode){

  const item=
    MEDIA_RESOURCES.find(item=>item.id===id);

  if(!item)return;

  const panel=
    document.getElementById("modePanel");

  let audioTools="";

  const listeningModes=[
    "听力",
    "精听",
    "跟读",
    "观看",
    "电影",
    "短视频",
    "视频"
  ];

  if(listeningModes.includes(mode)){

    audioTools=`

      <div class="player-card">

        <strong>
          🎧 听力辅助
        </strong>

        <p class="player-note">

          官方课程里的真实音频/视频请通过
          「打开官方资源」播放。
          Vicky's English 不伪造第三方音频。
          如果当前浏览器支持语音合成，
          下面也可以用系统声音进行辅助跟读。

        </p>

        <div class="player-controls">

          <button onclick="speakResource('${id}')">
            🔊 朗读辅助
          </button>

          <button onclick="stopSpeech()">
            ⏹ 停止
          </button>

          <button onclick="changeSpeechRate(.8)">
            🐢 0.8×
          </button>

          <button onclick="changeSpeechRate(1)">
            ▶ 1×
          </button>

          <button onclick="changeSpeechRate(1.25)">
            ⚡ 1.25×
          </button>

        </div>

      </div>

    `;

  }

  panel.innerHTML=`

    <h4>
      🎯 ${mode}模式
    </h4>

    <p>
      ${modeText(mode)}
    </p>

    <div class="check-list">

      <label>
        <input type="checkbox">
        第一遍：完整输入，不急着查词
      </label>

      <label>
        <input type="checkbox">
        第二遍：处理听不懂的部分
      </label>

      <label>
        <input type="checkbox">
        第三遍：主动输出 / 跟读 / 复述
      </label>

      <label>
        <input type="checkbox">
        记录本次最重要的 3 个词或表达
      </label>

    </div>

    ${audioTools}

    <div
      class="media-actions"
      style="margin-top:14px">

      <a
        class="media-main-btn"
        href="${item.url}"
        target="_blank"
        rel="noopener">

        现在去官方资源学习 ↗

      </a>

      <button
        class="media-done-btn"
        onclick="completeResource('${id}');closeMediaV5()">

        完成本资源 +20 XP

      </button>

    </div>

  `;

}


function speakResource(id){

  const item=
    MEDIA_RESOURCES.find(item=>item.id===id);

  if(!item)return;

  if(!("speechSynthesis" in window)){

    toast("当前浏览器不支持语音朗读");

    return;

  }

  stopSpeech();

  const text=
    item.name+
    ". "+
    item.desc+
    ". "+
    modeText(
      getJSON(STORAGE.mode,{})[id]||"听力"
    );

  currentSpeech=
    new SpeechSynthesisUtterance(text);

  currentSpeech.lang="en-US";

  currentSpeech.rate=speechRate;

  window.speechSynthesis.speak(currentSpeech);

}


function stopSpeech(){

  if("speechSynthesis" in window){

    window.speechSynthesis.cancel();

  }

}


function changeSpeechRate(rate){

  speechRate=rate;

  toast("朗读速度 "+rate+"×");

}


function saveNote(id){

  const textarea=
    document.getElementById("mediaNotes");

  if(!textarea)return;

  const notes=getNotes();

  notes[id]=textarea.value;

  saveJSON(STORAGE.notes,notes);

  toast("📝 笔记已保存");

}


function closeMediaV5(){

  document
    .getElementById("mediaModalV5")
    .classList.remove("show");

  stopSpeech();

}


document
  .getElementById("mediaFilter")
  .addEventListener("click",event=>{

    const button=
      event.target.closest("button");

    if(!button)return;

    document
      .querySelectorAll("#mediaFilter button")
      .forEach(item=>
        item.classList.remove("active")
      );

    button.classList.add("active");

    renderMediaV5(button.dataset.filter);

  });


document
  .getElementById("mediaSearch")
  .addEventListener(
    "input",
    ()=>{
      renderMediaV5(
        document
          .querySelector("#mediaFilter button.active")
          ?.dataset.filter||
        "全部"
      );
    }
  );


document
  .getElementById("mediaLevel")
  .addEventListener(
    "change",
    ()=>{
      renderMediaV5(
        document
          .querySelector("#mediaFilter button.active")
          ?.dataset.filter||
        "全部"
      );
    }
  );


document.addEventListener(
  "keydown",
  event=>{
    if(event.key==="Escape"){
      closeMediaV5();
    }
  }
);


renderMediaV5();

</script>

</body>
