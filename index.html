const DATA={xp:0,done:0,streak:0,lastDay:'',wrong:[],words:{},ach:[],history:[]};let S=Object.assign(DATA,JSON.parse(localStorage.getItem('VickysEnglishV3')||'{}'));function save(){localStorage.setItem('VickysEnglishV3',JSON.stringify(S));update()}function today(){return new Date().toISOString().slice(0,10)}function dayInit(){let t=today();if(S.lastDay!==t){S.lastDay=t;S.todayDone={};if(S.lastStudy===t){}else if(S.lastStudy){let d=new Date(S.lastStudy),y=new Date();y.setDate(y.getDate()-1);S.streak=d.toISOString().slice(0,10)===y.toISOString().slice(0,10)?(S.streak||0)+1:1}else S.streak=1;S.lastStudy=t;saveRaw()}}function saveRaw(){localStorage.setItem('VickysEnglishV3',JSON.stringify(S))}function lvl(){return Math.floor(S.xp/100)+1}function gain(n,task){dayInit();if(task&&S.todayDone?.[task]){toast('这个任务今天已经完成啦');return}S.xp+=n;S.done++;if(task){S.todayDone=S.todayDone||{};S.todayDone[task]=1}S.history.push({t:Date.now(),n});achievements();save();toast('+'+n+' XP ⚡')}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}function update(){document.getElementById('xp').textContent=S.xp;document.getElementById('lv').textContent=lvl();document.getElementById('streak').textContent=S.streak||0;if(document.getElementById('homeXP'))document.getElementById('homeXP').textContent=S.xp;if(document.getElementById('homeWrong'))document.getElementById('homeWrong').textContent=S.wrong.filter(x=>!x.master).length;if(document.getElementById('homeDone'))document.getElementById('homeDone').textContent=S.done;if(document.getElementById('homeAch'))document.getElementById('homeAch').textContent=S.ach.length;if(document.getElementById('pXP'))document.getElementById('pXP').textContent=S.xp;if(document.getElementById('pDone'))document.getElementById('pDone').textContent=S.done;if(document.getElementById('pWrong'))document.getElementById('pWrong').textContent=S.wrong.filter(x=>!x.master).length}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));let p=document.getElementById(id);if(p)p.classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));window.scrollTo({top:0,behavior:'smooth'});if(id==='wrong')renderWrong();if(id==='progress')renderProgress();if(id==='today')renderToday();if(id==='media')renderMedia()}document.getElementById('nav').innerHTML=NAV.map(x=>`<button data-id="${x[0]}" onclick="show('${x[0]}')">${x[1]}</button>`).join('');

let vm='ec',gm='choice',lm='hear',spm='shadow',wm='sentence',tm='ce';

function vmodes(el){document.querySelectorAll('#vocab .modebtn').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function lmm(el){document.querySelectorAll('#listen .modebtn').forEach(x=>x.classList.remove('active'));el.classList.add('active')}

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function norm(s){return String(s||'').toLowerCase().replace(/[.,!?;:'"“”‘’\-]/g,'').replace(/\s+/g,' ').trim()}
function addWrong(type,q,ans,user,extra=''){S.wrong=S.wrong||[];let old=S.wrong.find(x=>x.type===type&&x.q===q&&!x.master);if(old){old.count=(old.count||1)+1;old.user=user}else S.wrong.push({type,q,ans,user,count:1,master:false,extra})}
function masterWrong(type,q){let x=S.wrong.find(x=>x.type===type&&x.q===q);if(x){x.master=true;save()}}

function startVocab(){
let book=document.getElementById('vb').value,n=+document.getElementById('va').value;
let arr=shuffle(WORDS[book]).slice(0,n);let i=0,correct=0;
function render(){
if(i>=arr.length){document.getElementById('vg').innerHTML=`<div class="center"><h2>🎉 本轮完成</h2><p>正确 ${correct}/${arr.length}</p><button class="btn" onclick="startVocab()">再来一轮</button></div>`;gain(correct*5,'vocab-round');return}
let [en,zh]=arr[i];let q=vm==='ce'||vm==='spell'||vm==='listen'?zh:en;
let answer=vm==='ec'?zh:en;
let choices=vm==='ec'?shuffle([zh,...arr.filter(x=>x[1]!==zh).slice(0,3).map(x=>x[1])]):shuffle([en,...arr.filter(x=>x[0]!==en).slice(0,3).map(x=>x[0])]);
document.getElementById('vg').innerHTML=`<div class="quest"><div><span class="tag">${book}</span><div class="small">第 ${i+1}/${arr.length} 个</div><div class="question">${q}</div></div><div class="monster">🐛</div></div>${vm==='spell'?`<input id="vinput" placeholder="请输入英文单词" style="width:100%"> <button class="btn" onclick="vcheck(document.getElementById('vinput').value)">提交</button>`:vm==='listen'?`<button class="btn" onclick="speak('${en.replace(/'/g,"\\'")}')">🔊 听单词</button><div class="choices">${choices.map(c=>`<button class="choice" onclick="vcheck('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('')}</div>`:`<div class="choices">${choices.map(c=>`<button class="choice" onclick="vcheck('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('')}</div>`}`;
}
window.vcheck=function(v){let [en,zh]=arr[i],ans=vm==='ec'?zh:en;let ok=norm(v)===norm(ans);if(ok){correct++;document.getElementById('vg').insertAdjacentHTML('beforeend',`<div class="feedback good">✅ 正确！<br>${en} = ${zh}</div>`)}else{addWrong('vocab',vm==='ec'?en:zh,ans,v);document.getElementById('vg').insertAdjacentHTML('beforeend',`<div class="feedback bad">❌ 先记住：<b>${en}</b> = <b>${zh}</b></div>`)}setTimeout(()=>{i++;render()},900)}
render()
}

function startGrammar(){
let i=0,score=0;
function r(){
if(i>=GRAM.length){document.getElementById('gg').innerHTML=`<div class="center"><h2>🧟 语法怪已击败</h2><p>${score}/${GRAM.length}</p><button class="btn" onclick="startGrammar()">再战</button></div>`;gain(score*6,'grammar-round');return}
let x=GRAM[i];document.getElementById('gg').innerHTML=`<span class="tag">Grammar ${i+1}/${GRAM.length}</span><div class="question">${x[0]}</div><div class="choices">${x[1].map(c=>`<button class="choice" onclick="gc('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('')}</div>`;
}
window.gc=function(v){let x=GRAM[i],ok=v===x[2];if(ok){score++;document.getElementById('gg').insertAdjacentHTML('beforeend',`<div class="feedback good">✅ 正确！${x[3]}</div>`)}else{addWrong('grammar',x[0],x[2],v,x[3]);document.getElementById('gg').insertAdjacentHTML('beforeend',`<div class="feedback bad">❌ 答案：${x[2]}<br>${x[3]}</div>`)}setTimeout(()=>{i++;r()},1000)}

const LISTEN=[
['Hello! My name is Anna. Nice to meet you.','你好！我叫 Anna。很高兴认识你。'],
['Could you please send me the quotation by Friday?','你可以在周五之前把报价发给我吗？'],
['The delivery time is about six weeks after order confirmation.','订单确认后交期大约是六周。'],
['I am trying to improve my English every day.','我每天都在努力提高英语。'],
['Let me check with our engineer and get back to you.','让我和我们的工程师确认一下，然后回复你。']
];
function startListen(){
let i=0,score=0;
function r(){
if(i>=LISTEN.length){document.getElementById('lg').innerHTML=`<div class="center"><h2>🎧 Listening complete</h2><p>${score}/${LISTEN.length}</p><button class="btn" onclick="startListen()">再来</button></div>`;gain(score*8,'listen-round');return}
let [en,zh]=LISTEN[i];
let body=lm==='hear'?`<button class="btn" onclick="speak('${en.replace(/'/g,"\\'")}')">🔊 播放</button><p class="small">先听 2–3 遍，再点击显示答案。</p><button class="btn alt" onclick="document.getElementById('la').classList.remove('hidden')">显示原文</button><div id="la" class="ref hidden">${en}<br><span class="small">${zh}</span></div>`:
`<button class="btn" onclick="speak('${en.replace(/'/g,"\\'")}')">🔊 播放</button><textarea id="li" placeholder="${lm==='zh'?'写出中文意思':'写下你听到的英文'}"></textarea><button class="btn" onclick="lc()">提交</button>`;
document.getElementById('lg').innerHTML=`<span class="tag">Listening ${i+1}/${LISTEN.length}</span>${body}`
}
window.lc=function(){let [en,zh]=LISTEN[i],u=document.getElementById('li').value;let ans=lm==='zh'?zh:en;let sim=norm(u)===norm(ans);if(sim)score++;else addWrong('listening',en,ans,u);document.getElementById('lg').insertAdjacentHTML('beforeend',`<div class="feedback ${sim?'good':'bad'}">${sim?'✅ 很好！':'❌ 参考答案：'+ans}</div>`);setTimeout(()=>{i++;r()},1200)}
r()
}

const SPEAK={
daily:[['Introduce yourself in English.','Hello, my name is Vicky. I work in foreign trade and I am learning English.'],['Tell me about your day.','Today I worked, studied English and practiced speaking.'],['Ask someone where they are from.','Where are you from? Nice to meet you.']],
work:[['Tell a customer you will check the price.','Let me check the price with our engineer and get back to you.'],['Ask about the target price.','May I know your target price for this project?'],['Tell a customer the lead time.','The lead time is about six weeks after order confirmation.']],
customer:[['Follow up on a quotation.','Hi, I just wanted to follow up on our quotation. Have you had a chance to review it?'],['Ask whether the customer needs any changes.','Please let me know if you would like us to revise anything.'],['Ask for feedback politely.','If you have any comments on the quotation, I would be happy to discuss them with you.']],
travel:[['Ask for directions.','Excuse me, could you tell me how to get to the train station?'],['Order a coffee.','Could I have a coffee, please?'],['Check in at a hotel.','Hi, I have a reservation under the name Vicky.']],
interview:[['Introduce your work experience.','I have around three years of experience in foreign trade sales.'],['Explain your strength.','I am good at communicating with customers and following up on projects.'],['Explain what you want to improve.','I want to improve my English communication and translation skills.']]
};
function startSpeak(){
let topic=document.getElementById('spTopic').value,arr=SPEAK[topic],i=0;
function r(){if(i>=arr.length){document.getElementById('sg').innerHTML=`<div class="center"><h2>🗣️ 口语任务完成</h2><button class="btn" onclick="startSpeak()">再练一次</button></div>`;gain(20,'speak-round');return}
let [q,a]=arr[i];document.getElementById('sg').innerHTML=`<span class="tag">${topic}</span><div class="question">${q}</div><p>先自己说，不要急着看答案。</p><button class="btn" onclick="startRecognition('${a.replace(/'/g,"\\'")}')">🎙️ 开始说</button> <button class="btn alt" onclick="speak('${a.replace(/'/g,"\\'")}')">🔊 听参考</button><button class="btn gray" onclick="document.getElementById('sa').classList.remove('hidden')">显示参考</button><div id="sa" class="ref hidden">${a}</div><div id="sr"></div>`}
window.nextSpeak=()=>{i++;r()};r()
}
function startRecognition(ref){
if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){document.getElementById('sr').innerHTML='<div class="feedback bad">当前浏览器不支持语音识别。你可以先点击听参考，然后自己跟读。</div>';return}
let R=window.SpeechRecognition||window.webkitSpeechRecognition,rec=new R();rec.lang='en-US';rec.interimResults=false;rec.onresult=e=>{let u=e.results[0][0].transcript,score=Math.round(similarity(u,ref)*100);document.getElementById('sr').innerHTML=`<div class="feedback ${score>=65?'good':'bad'}">你说的是：${u}<br>相似度：${score}%<br><button class="btn" onclick="nextSpeak()">下一题</button></div>`;if(score>=65)gain(8,'speak-item');else addWrong('speaking',ref,ref,u)};rec.start()}
function similarity(a,b){let A=norm(a).split(' '),B=norm(b).split(' '),hit=A.filter(x=>B.includes(x)).length;return hit/Math.max(A.length,B.length,1)}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}}

}
